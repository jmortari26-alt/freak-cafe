<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Freak Café · prévia reservada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230F0F0E'/%3E%3Cpath d='M16 26h26v12a11 11 0 0 1-11 11h-4a11 11 0 0 1-11-11z' fill='%23F2C534'/%3E%3Cpath d='M42 30h3a5 5 0 0 1 0 10h-4' fill='none' stroke='%23F3ECDD' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{--fundo:#0F0F0E;--papel:#F3ECDD;--tinta:#1C1915;--amarelo:#F2C534;--apoio:#A39C8E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--papel);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.portao{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.cartao{width:min(420px,100%);text-align:center}
.xicara{width:64px;height:64px;margin:0 auto 22px;display:block}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--apoio);margin:0 0 28px}
form{display:grid;gap:12px}
input[type=password]{width:100%;height:52px;border-radius:12px;border:1.5px solid #3A3631;background:#191816;color:var(--papel);
  font-size:17px;padding:0 16px;text-align:center;letter-spacing:.04em}
input[type=password]:focus{outline:none;border-color:var(--amarelo)}
button{height:52px;border:0;border-radius:999px;background:var(--amarelo);color:var(--tinta);font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.lembrar{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--apoio);font-size:14px}
.msg{min-height:22px;font-size:14px;color:var(--apoio)}
.msg.erro{color:#F08A6E}
.barra{height:3px;background:#2A2724;border-radius:3px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--amarelo);transition:width .2s}
.selo{margin-top:30px;font-size:12.5px;color:#7D776C}
</style>
</head>
<body>
<main class="portao">
  <div class="cartao">
    <svg class="xicara" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 26h30v14a13 13 0 0 1-13 13h-4a13 13 0 0 1-13-13z" fill="#F2C534" stroke="#F3ECDD" stroke-width="2.4"/><path d="M44 30h4a6 6 0 0 1 0 12h-5" fill="none" stroke="#F3ECDD" stroke-width="2.4"/><path d="M8 56h42" stroke="#F3ECDD" stroke-width="2.4" stroke-linecap="round"/><path d="M24 20c-3-4 3-6 0-11M32 20c-3-4 3-6 0-11" fill="none" stroke="#A39C8E" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>Freak Café</h1>
    <p class="sub">Prévia reservada de um estudo de redesign do site.<br>Digite a senha que você recebeu.</p>
    <form id="f" autocomplete="off">
      <input id="senha" type="password" placeholder="Senha" aria-label="Senha" required>
      <button id="b" type="submit">Abrir a prévia</button>
      <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <div class="barra" aria-hidden="true"><i id="p"></i></div>
      <p class="msg" id="m" role="status"></p>
    </form>
    <p class="selo">Estudo de redesign · não é o site oficial</p>
  </div>
</main>
<script>
(function () {
  var VOLTAS = 310000, CHAVE = "freak-previa-senha";
  var f = document.getElementById("f"), campo = document.getElementById("senha"), botao = document.getElementById("b");
  var msg = document.getElementById("m"), barra = document.getElementById("p"), lembrar = document.getElementById("lembrar");
  var conteudo = null;
  // baixa o conteúdo cifrado enquanto a pessoa digita a senha
  function baixar() {
    if (conteudo) { return conteudo; }
    conteudo = fetch("conteudo.bin").then(function (r) {
      if (!r.ok || !r.body) { return r.arrayBuffer(); }
      var total = +r.headers.get("content-length") || 0, lido = 0, partes = [], leitor = r.body.getReader();
      function passo() {
        return leitor.read().then(function (x) {
          if (x.done) { return new Blob(partes).arrayBuffer(); }
          partes.push(x.value); lido += x.value.length;
          if (total) { barra.style.width = Math.min(100, lido / total * 100).toFixed(0) + "%"; }
          return passo();
        });
      }
      return passo();
    });
    return conteudo;
  }
  function abrir(senha) {
    botao.disabled = true; msg.className = "msg"; msg.textContent = "Abrindo a prévia…";
    return baixar().then(function (buf) {
      var b = new Uint8Array(buf), sal = b.slice(0, 16), iv = b.slice(16, 28), dados = b.slice(28);
      return crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]).then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: VOLTAS, hash: "SHA-256" }, base,
          { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      }).then(function (chave) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, dados);
      });
    }).then(function (claro) {
      try { if (lembrar.checked) { localStorage.setItem(CHAVE, senha); } } catch (e) { /* navegador sem armazenamento */ }
      var fluxo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(fluxo).text();
    }).then(function (html) {
      document.open(); document.write(html); document.close();
    }).catch(function () {
      try { localStorage.removeItem(CHAVE); } catch (e) { /* sem armazenamento */ }
      botao.disabled = false; msg.className = "msg erro"; msg.textContent = "Senha não confere. Tente de novo.";
      campo.select();
    });
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); if (campo.value) { abrir(campo.value.trim()); } });
  campo.addEventListener("input", baixar, { once: true });
  var guardada = null;
  try { guardada = localStorage.getItem(CHAVE); } catch (e) { /* sem armazenamento */ }
  if (guardada) { abrir(guardada); } else { campo.focus(); }
})();
</script>
</body>
</html>
